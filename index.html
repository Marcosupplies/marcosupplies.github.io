<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<title>MarCo Operations</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#F5F7FA; --surface3:#E9EDF2;
  --border:#D5DBE3; --border2:#BFC7D2;
  --ink:#0D0E0E; --text:#15181C; --muted:#5B6370; --faint:#8C93A0; --grey:#969696;
  --blue:#003C84; --blue2:#0B4FA3; --blue-soft:#E1EAF6; --blue-soft2:#C9D9EE; --on-blue:#FFFFFF;
  --bar:#003C84; --bar-text:#FFFFFF; --bar-muted:rgba(255,255,255,.62); --bar-line:rgba(255,255,255,.14);
  --ok:#1E7F4F; --ok-soft:#DFF2E7; --warn:#A86A12; --warn-soft:#FBEED4; --bad:#B42318; --bad-soft:#FBE3E0;
  --amz:#C45500; --amz-soft:#FCE9DA; --carpet:#5A3FA0; --carpet-soft:#ECE6F8;
  --shadow:0 1px 2px rgba(13,14,14,.05),0 6px 16px rgba(13,14,14,.06);
  --shadow2:0 12px 40px rgba(13,14,14,.18);
  --r:5px; --r2:8px;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0E0E; --surface:#16191D; --surface2:#1C2025; --surface3:#242930;
    --border:#2B313A; --border2:#3B434E;
    --text:#E8EBEF; --muted:#A5ADB8; --faint:#7A8390;
    --blue:#5E9AE6; --blue2:#7FB1F0; --blue-soft:#132844; --blue-soft2:#1B3A63; --on-blue:#0D0E0E;
    --bar:#111418; --bar-text:#F2F4F7; --bar-muted:rgba(242,244,247,.6); --bar-line:rgba(255,255,255,.1);
    --ok:#4CC182; --ok-soft:#12301F; --warn:#E0A649; --warn-soft:#3A2B10; --bad:#F07C72; --bad-soft:#3E1A16;
    --amz:#FF9E4A; --amz-soft:#3B2211; --carpet:#B39DF0; --carpet-soft:#2A2145;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
    --shadow2:0 12px 40px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0E0E; --surface:#16191D; --surface2:#1C2025; --surface3:#242930;
  --border:#2B313A; --border2:#3B434E;
  --text:#E8EBEF; --muted:#A5ADB8; --faint:#7A8390;
  --blue:#5E9AE6; --blue2:#7FB1F0; --blue-soft:#132844; --blue-soft2:#1B3A63; --on-blue:#0D0E0E;
  --bar:#111418; --bar-text:#F2F4F7; --bar-muted:rgba(242,244,247,.6); --bar-line:rgba(255,255,255,.1);
  --ok:#4CC182; --ok-soft:#12301F; --warn:#E0A649; --warn-soft:#3A2B10; --bad:#F07C72; --bad-soft:#3E1A16;
  --amz:#FF9E4A; --amz-soft:#3B2211; --carpet:#B39DF0; --carpet-soft:#2A2145;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
  --shadow2:0 12px 40px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--blue)}
h1,h2,h3,h4{margin:0;font-family:var(--display);line-height:1.15;text-wrap:balance}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .xs{font-size:12px}
.b{font-weight:600} .right{text-align:right}
.eyebrow{font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hide{display:none!important}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .blue{color:var(--blue)}

/* top bar */
.topbar{background:var(--bar);color:var(--bar-text);position:sticky;top:0;z-index:40;border-bottom:1px solid var(--bar-line)}
.topbar-in{max-width:1280px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit}
.logo svg{width:30px;height:30px;flex:none}
.logo .wm{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.06em;line-height:1}
.logo .wm small{display:block;font-size:9.5px;letter-spacing:.14em;font-weight:600;color:var(--bar-muted);margin-top:2px}
.seg{display:flex;background:rgba(255,255,255,.1);border:1px solid var(--bar-line);border-radius:var(--r);padding:2px;margin-left:auto}
.seg button{padding:6px 14px;border-radius:3px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.02em;color:var(--bar-muted)}
.seg button.on{background:var(--surface);color:var(--text)}
.iconbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--bar-text);position:relative}
.iconbtn:hover{background:rgba(255,255,255,.1)}
.iconbtn svg{width:20px;height:20px}
.badge-n{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#FFB020;color:#0D0E0E;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}

/* sub nav */
.subnav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:30}
.subnav-in{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.subnav-in::-webkit-scrollbar{display:none}
.subnav button{padding:11px 12px;font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.subnav button.on{color:var(--blue);border-color:var(--blue)}
.subnav button:hover{color:var(--text)}

/* layout */
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 96px}
.team-layout{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.rail{position:sticky;top:60px;display:flex;flex-direction:column;gap:2px}
.rail button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);text-align:left;color:var(--text)}
.rail button:hover{background:var(--surface3)}
.rail button.on{background:var(--surface);box-shadow:var(--shadow)}
.rail .who{line-height:1.15}
.rail .who b{display:block;font-family:var(--display);font-weight:600;font-size:14.5px}
.rail .who span{font-size:12px;color:var(--muted)}
.rail .rail-h{font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
.avatar{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:13px;color:#fff;background:var(--blue)}
.roles-mobile{display:none;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.roles-mobile::-webkit-scrollbar{display:none}
.roles-mobile button{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-family:var(--display);font-weight:600;font-size:13.5px}
.roles-mobile button.on{border-color:var(--blue);background:var(--blue-soft)}
.roles-mobile .avatar{width:26px;height:26px;font-size:11px}
@media (max-width:900px){.team-layout{grid-template-columns:1fr}.rail{display:none}.roles-mobile{display:flex}}
@media (max-width:640px){.logo .wm small{display:none}.logo .wm{font-size:18px}.topbar-in{gap:10px}}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:9px 12px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.tabs .cnt{font-family:var(--mono);font-size:11px;background:var(--surface3);color:var(--text);padding:1px 6px;border-radius:9px}
.tabs button.on .cnt{background:var(--blue);color:var(--on-blue)}

.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h p{color:var(--muted);margin-top:3px;max-width:62ch}

/* cards & grids */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:16px}
.card.tight{padding:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-size:15.5px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.g-12{grid-template-columns:1fr 1fr} .g-21{grid-template-columns:2fr 1fr}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.g-12,.g-21{grid-template-columns:1fr}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}.g4.keep2,.g2.keep2{grid-template-columns:1fr 1fr}}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.sp{flex:1}

.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;min-width:0}
.kpi .l{font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
.kpi .d.up{color:var(--ok)} .kpi .d.down{color:var(--bad)}
.kpi svg.spark{width:100%;height:34px;margin-top:8px;display:block}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;font-family:var(--display);letter-spacing:.02em;white-space:nowrap;background:var(--surface3);color:var(--text);line-height:1.5}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--blue-soft);color:var(--blue)} .pill.amz{background:var(--amz-soft);color:var(--amz)} .pill.carpet{background:var(--carpet-soft);color:var(--carpet)}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.stripe{border-left:3px solid var(--border2)}
.stripe.ok{border-left-color:var(--ok)} .stripe.warn{border-left-color:var(--warn)} .stripe.bad{border-left-color:var(--bad)} .stripe.blue{border-left-color:var(--blue)} .stripe.carpet{border-left-color:var(--carpet)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:var(--r);font-family:var(--display);font-weight:600;font-size:14.5px;letter-spacing:.01em;border:1px solid var(--border2);background:var(--surface);color:var(--text);white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--surface2)}
.btn.p{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.btn.p:hover{background:var(--blue2);border-color:var(--blue2)}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--surface3)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)} .btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px} .btn.lg{padding:13px 20px;font-size:16px}
.btn.wide{width:100%} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.inp,.sel,textarea.inp{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:15px;min-height:40px}
.inp:focus,.sel:focus{outline:2px solid var(--blue2);outline-offset:-1px;border-color:var(--blue2)}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.search .inp{padding-left:34px}
.choice{display:grid;gap:8px}
.choice label{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:pointer}
.choice label:has(input:checked){border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.choice input{margin-top:3px;accent-color:var(--blue)}
.choice .t{font-family:var(--display);font-weight:600;font-size:15px}
.choice .s{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--border2);background:var(--surface);font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
:root[data-theme="dark"] .chip.on{background:#E8EBEF;color:#0D0E0E;border-color:#E8EBEF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{background:#E8EBEF;color:#0D0E0E;border-color:#E8EBEF}}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{appearance:none;width:36px;height:20px;border-radius:10px;background:var(--border2);position:relative;transition:.15s;flex:none;margin:0}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.toggle input:checked{background:var(--blue)} .toggle input:checked::after{left:18px}

/* tables */
.tw{overflow-x:auto;margin:0 -12px;padding:0 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--display);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:0}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-family:var(--display);font-weight:600;font-size:15px}
.li .m span{font-size:13px;color:var(--muted);display:block}
.li.click{cursor:pointer;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:var(--r)} .li.click:hover{background:var(--surface2)}

/* storefront */
.hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:22px 20px;display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:var(--blue-soft);opacity:.7;pointer-events:none}
.hero>*{position:relative}
.hero h1{font-size:30px}
.hero .lead{color:var(--muted);margin-top:6px;max-width:48ch}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero h1{font-size:25px}}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:900px){.cats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.cats{grid-template-columns:repeat(2,1fr)}}
.cat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:104px;transition:border-color .12s}
.cat:hover{border-color:var(--blue)}
.cat svg{width:34px;height:34px}
.cat b{font-family:var(--display);font-weight:600;font-size:14.5px;line-height:1.2}
.cat span{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
@media (max-width:420px){.pgrid{grid-template-columns:repeat(2,1fr);gap:8px}}
.prod{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.prod .art{background:var(--surface2);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid var(--border)}
.prod .art svg{width:70%;height:70%}
.prod .flag{position:absolute;top:8px;left:8px}
.prod .body{padding:10px 11px 11px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod .v{font-family:var(--display);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.prod .n{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .sz{font-size:12.5px;color:var(--muted)}
.prod .sku{font-family:var(--mono);font-size:11px;color:var(--faint)}
.prod .pr{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.prod .pr b{font-family:var(--display);font-size:18px;font-weight:700}
.prod .pr span{font-size:12px;color:var(--muted)}
.prod .add{display:flex;gap:6px;margin-top:8px}
.prod .add .btn{flex:1;padding:7px 6px;font-size:13px}
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:block}
.drawer .bd{position:absolute;inset:0;background:rgba(13,14,14,.45)}
.drawer .pn{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);box-shadow:var(--shadow2);display:flex;flex-direction:column}
.drawer .pn-h{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.drawer .pn-b{flex:1;overflow-y:auto;padding:12px 16px}
.drawer .pn-f{padding:14px 16px;border-top:1px solid var(--border);background:var(--surface2)}
.cart-i{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center}
.cart-i .th{width:48px;height:48px;background:var(--surface2);border-radius:var(--r);display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--border)}
.cart-i .th svg{width:34px;height:34px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden}
.qty button{width:28px;height:28px;font-size:16px;font-weight:600} .qty button:hover{background:var(--surface3)}
.qty span{min-width:28px;text-align:center;font-family:var(--mono);font-size:13px}
.fab{position:fixed;right:16px;bottom:16px;z-index:35;display:flex;flex-direction:column;gap:8px}
.fab button{width:48px;height:48px;border-radius:50%;background:var(--blue);color:var(--on-blue);box-shadow:var(--shadow2);display:flex;align-items:center;justify-content:center}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-family:var(--display);font-weight:600;font-size:14px;z-index:90;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow2)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:#F2F4F7;color:#0D0E0E}}

/* team specifics */

.decide .d{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px;border-left:4px solid var(--warn)}

.decide .d .btn-row{margin-top:10px}
.decide .d.done{border-left-color:var(--ok);opacity:.7}
.bar{height:8px;background:var(--surface3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.carpet{background:var(--carpet)} .bar i.amz{background:var(--amz)}
.stepflow{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:22px 18px;text-align:center;max-width:520px;margin:0 auto}

.route{position:relative;padding-left:26px}
.route::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:2px;background:var(--border2)}
.stop{position:relative;padding:10px 0 10px 8px}

.stop.done::before{background:var(--ok);border-color:var(--ok)} .stop.now::before{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.drive{font-size:12px;color:var(--faint);padding:0 0 0 8px;display:flex;align-items:center;gap:6px}

@media (max-width:760px){.dboard{grid-template-columns:1fr}}
.truck{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}

.job{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;cursor:pointer}

.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}

.photo{aspect-ratio:4/3;background:var(--surface3);border-radius:var(--r);border:1px dashed var(--border2);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;overflow:hidden;position:relative}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

.msg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}

.msg .body{flex:1;min-width:0;font-size:14px}
.msg .body span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.preview{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface2)}
.preview .ph{padding:8px 12px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12px;color:var(--muted)}

.sms{max-width:300px;background:var(--blue);color:var(--on-blue);padding:10px 12px;border-radius:14px 14px 4px 14px;font-size:14px;line-height:1.4}
.sig{width:100%;height:120px;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--r);touch-action:none;display:block}
.hl{background:var(--warn-soft)}
.note{font-size:13px;color:var(--muted);padding:10px 12px;background:var(--surface2);border-radius:var(--r);border:1px solid var(--border)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.two-biz{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two-biz{grid-template-columns:1fr}}
.biz{padding:14px;border-radius:var(--r2);border:1px solid var(--border);background:var(--surface)}
.biz.supply{border-top:4px solid var(--blue)} .biz.carpet{border-top:4px solid var(--carpet)}
.biz .n{font-family:var(--display);font-weight:700;font-size:16px}
.biz .v{font-family:var(--display);font-size:24px;font-weight:700;margin-top:4px}
/* ---- sign-in, sync, menu ---- */
.sync{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--bar-muted);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)} .sync.on i{background:#4CC182} .sync.busy i{background:#FFB020}
@media (max-width:640px){.sync span{display:none}}
.menu{position:absolute;right:0;top:44px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow2);min-width:220px;padding:6px;z-index:50;display:none;color:var(--text)}
.menu.open{display:block}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.people button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border:1px solid var(--border);border-radius:var(--r2);background:var(--surface);text-align:center}
.people button.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.people button b{font-family:var(--display);font-size:14px;line-height:1.15} .people button span{font-size:11.5px;color:var(--muted)}
.people .avatar{width:40px;height:40px;font-size:15px}
.pin{display:flex;gap:10px;justify-content:center;margin:14px 0 10px}
.pin i{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);display:block} .pin i.on{background:var(--blue);border-color:var(--blue)}
.pin.err i{border-color:var(--bad);background:var(--bad-soft)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto}
.pad button{height:54px;border-radius:var(--r2);background:var(--surface2);border:1px solid var(--border);font-family:var(--display);font-size:22px;font-weight:600}
.pad button:hover{background:var(--surface3)} .pad button.fn{font-size:14px;color:var(--muted)}
.rail button.locked{opacity:.55} .rail .lk{margin-left:auto;width:14px;height:14px;color:var(--faint);flex:none}
/* ---- payments ---- */
.cardform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cardform .full{grid-column:1/-1}
.cardnum{position:relative}
.cardnum .brand{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:3px;background:var(--surface3);color:var(--muted)}
.cardnum .brand.visa{background:#1A1F71;color:#fff} .cardnum .brand.mc{background:#EB001B;color:#fff} .cardnum .brand.amex{background:#006FCF;color:#fff} .cardnum .brand.disc{background:#FF6000;color:#fff}
.testmode{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:3px}
.tap{width:100%;aspect-ratio:2.2/1;max-height:150px;border-radius:var(--r2);background:var(--blue);color:var(--on-blue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:600;cursor:pointer;position:relative;overflow:hidden}
.tap svg{width:34px;height:34px} .tap .ring{position:absolute;inset:0;border-radius:var(--r2);border:2px solid rgba(255,255,255,.5);animation:ring 1.6s infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.08);opacity:0}}
.spin{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---- dispatch: hauling lane ---- */
.lane-h{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.lane-h h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lane-h::after{content:"";flex:1;height:1px;background:var(--border)}
.dboard.haul{grid-template-columns:repeat(2,1fr)}
@media (max-width:760px){.dboard.haul{grid-template-columns:1fr}}
.truck.haul .th{background:var(--warn-soft)}
.truck .th .avatar.haul{background:var(--warn)}
.saved{font-family:var(--mono);font-size:12px;color:var(--ok);background:var(--ok-soft);padding:2px 8px;border-radius:3px}
/* ---- photos ---- */
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.has{border-style:solid;cursor:zoom-in}
.photo .re{position:absolute;right:6px;top:6px;background:rgba(13,14,14,.7);color:#fff;font-size:11px;padding:2px 7px;border-radius:3px;font-family:var(--display);font-weight:600}
.lightbox img{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:var(--r)}
/* ---- outbox / estimates ---- */
.ob{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.ob:last-child{border-bottom:0}
.ob .via{width:44px;height:44px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}

.ob .m{flex:1;min-width:0} .ob .m b{display:block;font-family:var(--display);font-size:14.5px}
.ob .m .bd{font-size:13px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.est{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.step-dots{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.step-dots i{width:8px;height:8px;border-radius:50%;background:var(--border2);display:inline-block} .step-dots i.on{background:var(--ok)} .step-dots i.now{background:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.loadpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.loadpick{grid-template-columns:repeat(2,1fr)}}
.loadpick button{padding:10px 6px;border:1px solid var(--border);border-radius:var(--r2);background:var(--surface);text-align:center}
.loadpick button.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.loadpick svg{width:48px;height:30px;display:block;margin:0 auto 4px}
.loadpick b{font-family:var(--display);font-size:14px;display:block} .loadpick span{font-size:12px;color:var(--muted)}
.amz-q{border:1px dashed var(--border2);border-radius:var(--r2);padding:12px;background:var(--surface2)}
.pager{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.pager button{min-width:34px;height:34px;padding:0 8px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);font-family:var(--mono);font-size:13px}
.pager button.on{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
/* ---- integrator additions (requested by 05-store / 06-book) ---- */
.note.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)} .note.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.pager button:disabled{opacity:.4;cursor:default}
.g-21>*,.g-12>*{min-width:0}
/* ---- wave 2 (core): freight options, free-ground goal bar, scanner, blind counts, takeover progress, Prop 65 ---- */
.rateopt{display:grid;gap:8px}
.rateopt label{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:11px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:pointer}
.rateopt label:has(input:checked){border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.rateopt input{margin-top:3px;accent-color:var(--blue)}
.rateopt .t{font-family:var(--display);font-weight:600;font-size:15px} .rateopt .s{font-size:13px;color:var(--muted);margin-top:2px} .rateopt .cap{font-size:12px;color:var(--ok);margin-top:4px}
.rateopt .pr{font-family:var(--mono);font-weight:600;white-space:nowrap;text-align:right;min-width:0} .rateopt .pr small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.rateopt label.off{opacity:.55;cursor:default}
.bar-goal{height:10px;background:var(--surface3);border:1px solid var(--border);border-radius:6px;overflow:hidden} .bar-goal i{display:block;height:100%;background:var(--blue);border-radius:6px;transition:width .3s} .bar-goal.met i{background:var(--ok)}
.scanbox video{width:100%;max-height:52vh;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--ink);border-radius:var(--r2);border:1px solid var(--border)}
.count-blind{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)} .count-blind:last-child{border-bottom:0}
.count-blind .inp{width:96px;text-align:right;font-family:var(--mono);font-size:18px;min-height:44px}
.count-blind .why{font-size:12px;color:var(--muted)} .count-blind .why.ex{color:var(--bad)} .count-blind .why.ctl{color:var(--blue)}
.count-blind.done{opacity:.55} .count-blind.recount{background:var(--warn-soft);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:var(--r)}
.takeover progress{width:100%;height:12px;display:block;border:0;appearance:none;-webkit-appearance:none;background:var(--surface3);border-radius:6px;overflow:hidden}
.takeover progress::-webkit-progress-bar{background:var(--surface3);border-radius:6px} .takeover progress::-webkit-progress-value{background:var(--blue);border-radius:6px} .takeover progress::-moz-progress-bar{background:var(--blue);border-radius:6px}
.takeover .bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}

.takeover .bins button.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)} .takeover .bins button.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.warn-p65{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--text);border-radius:var(--r);font-size:12.5px;line-height:1.4}
.warn-p65 b{color:var(--warn);font-family:var(--display);letter-spacing:.04em;white-space:nowrap} .warn-p65 a{color:var(--warn)}
/* ---- labels & printing ---- */
.bc{width:100%;height:auto;display:block;color:#000}

.label{background:#fff;color:#000;border:1px solid #bbb;box-shadow:0 1px 3px rgba(0,0,0,.15);font-family:var(--font);flex:none;box-sizing:border-box;position:relative;overflow:hidden}

/* ---- routing: nearest-neighbour + 2-opt over driveMin(); returns {order:[indices], minutes} ---- */
function optimizeRoute(pts,depot,returnToDepot){const n=pts.length;if(n<2)return {order:pts.map((_,i)=>i),minutes:n?driveMin(depot,pts[0])+(returnToDepot?driveMin(pts[0],depot):0):0};
  const len=o=>{let s=driveMin(depot,pts[o[0]]);for(let i=1;i<o.length;i++)s+=driveMin(pts[o[i-1]],pts[o[i]]);if(returnToDepot)s+=driveMin(pts[o[o.length-1]],depot);return s};
  let order=[];const used=new Set();let cur=depot;for(let k=0;k<n;k++){let best=-1,bd=1e9;for(let i=0;i<n;i++){if(used.has(i))continue;const d=driveMin(cur,pts[i]);if(d<bd){bd=d;best=i}}order.push(best);used.add(best);cur=pts[best]}
  let best=len(order),improved=true,it=0;while(improved&&it++<60){improved=false;for(let i=0;i<n-1;i++)for(let j=i+1;j<n;j++){const cand=order.slice(0,i).concat(order.slice(i,j+1).reverse(),order.slice(j+1));const L=len(cand);if(L<best-0.5){order=cand;best=L;improved=true}}}
  return {order,minutes:best}}
const routeMinutes=(pts,depot,ret)=>{let s=0,prev=depot;pts.forEach(p=>{s+=driveMin(prev,p);prev=p});if(ret&&pts.length)s+=driveMin(prev,depot);return s};
/* Re-sequence one truck's not-yet-done jobs for a day, keeping each job inside its arrival window. Returns minutes saved. */
function optimizeTruckDay(truckId,dOff){const all=JOBS.filter(j=>j.truck===truckId&&j.dOff===dOff&&j.status!=='cancelled').sort((a,b)=>a.start-b.start);const fixed=all.filter(j=>['done','working','enroute'].includes(j.status));const open=all.filter(j=>!['done','working','enroute'].includes(j.status));if(open.length<2)return 0;
  const depot=truckById(truckId)?.kind==='haul'?DEPOT.carpet:DEPOT.carpet;const before=routeMinutes(all.map(j=>CUST[j.cid]),depot);
  const groups={};open.forEach(j=>{(groups[j.win]=groups[j.win]||[]).push(j)});let prev=fixed.length?CUST[fixed[fixed.length-1].cid]:depot;let cur=fixed.length?Math.max(...fixed.map(j=>j.start+j.dur)):8*60;const seq=[];
  WINDOWS.forEach(([h,w])=>{const g=groups[w];if(!g)return;const {order}=optimizeRoute(g.map(j=>CUST[j.cid]),prev,false);order.forEach(i=>{const j=g[i];const dr=driveMin(prev,CUST[j.cid]);cur=Math.max(h*60,cur+dr);j.start=cur;j.drive=dr;cur+=j.dur+5;prev=CUST[j.cid];seq.push(j)})});
  const after=routeMinutes(fixed.concat(seq).map(j=>CUST[j.cid]),depot);return Math.max(0,before-after)}
/* Place a new job: picks the truck + start that adds the least driving inside the requested window. Sets j.truck, j.start, j.drive. */
function placeJob(j,trucks){trucks=trucks||(j.svc==='hauling'?HAULERS:TRUCKS);const h=(WINDOWS.find(w=>w[1]===j.win)||WINDOWS[1])[0];const c=CUST[j.cid];let best=null;
  for(const t of trucks){if(t.id==='T3'&&j.dOff===thuOff)continue;const tj=JOBS.filter(x=>x.dOff===j.dOff&&x.truck===t.id&&x.id!==j.id&&x.status!=='cancelled').sort((a,b)=>a.start-b.start);if(tj.filter(x=>x.win===j.win).length>=(t.kind==='haul'?1:2))continue;
    const prev=tj.filter(x=>x.start<h*60+120).pop(),next=tj.find(x=>x.start>=h*60+120);const a=prev?CUST[prev.cid]:DEPOT.carpet;const added=driveMin(a,c)+(next?driveMin(c,CUST[next.cid])-driveMin(a,CUST[next.cid]):0);const start=Math.max(h*60,prev?prev.start+prev.dur+driveMin(a,c):h*60);if(start>h*60+110)continue;const score=added+tj.length*4;if(!best||score<best.score)best={t,start,score,drive:driveMin(a,c)}}
  if(!best){const t=trucks.map(t=>({t,n:JOBS.filter(x=>x.dOff===j.dOff&&x.truck===t.id).length})).sort((a,b)=>a.n-b.n)[0].t;best={t,start:h*60,drive:driveMin(DEPOT.carpet,c)}}
  j.truck=best.t.id;j.start=best.start;j.drive=best.drive;return j}

function cardBrand(n){n=n.replace(/\D/g,'');if(/^4/.test(n))return ['visa','VISA'];if(/^(5[1-5]|2[2-7])/.test(n))return ['mc','MC'];if(/^3[47]/.test(n))return ['amex','AMEX'];if(/^6(011|5)/.test(n))return ['disc','DISC'];return ['','CARD']}
function luhn(n){n=n.replace(/\D/g,'');if(n.length<13)return false;let s=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(alt){d*=2;if(d>9)d-=9}s+=d;alt=!alt}return s%10===0}
/* cardForm(prefix) → HTML; readCard(prefix) → {ok, last4, brand, exp, err}. Inputs get ids prefix+'Num', 'Exp', 'Cvc', 'Zip', 'Name'. */
function cardForm(p,opts={}){const c=S.card||{};return `<div class="cardform"><div class="field full"><label for="${p}Num">Card number <span class="testmode">test mode</span></label><div class="cardnum"><input id="${p}Num" class="inp mono" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242" value="${esc(c.num||'')}" data-inp="card-num" data-p="${p}"><span class="brand ${cardBrand(c.num||'')[0]}" id="${p}Brand">${cardBrand(c.num||'')[1]}</span></div></div><div class="field"><label for="${p}Exp">Expires</label><input id="${p}Exp" class="inp mono" inputmode="numeric" autocomplete="cc-exp" placeholder="MM / YY" value="${esc(c.exp||'')}" data-inp="card-exp" data-p="${p}"></div><div class="field"><label for="${p}Cvc">CVC</label><input id="${p}Cvc" class="inp mono" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4" value="${esc(c.cvc||'')}" data-inp="card-cvc"></div><div class="field"><label for="${p}Name">Name on card</label><input id="${p}Name" class="inp" autocomplete="cc-name" placeholder="${esc(opts.name||'')}" value="${esc(c.name||'')}" data-inp="card-name"></div><div class="field"><label for="${p}Zip">ZIP</label><input id="${p}Zip" class="inp mono" inputmode="numeric" autocomplete="postal-code" placeholder="93618" value="${esc(c.zip||'')}" data-inp="card-zip"></div>${opts.note!==false?`<p class="xs muted full">Test mode: the number is checked (Luhn, expiry, CVC) and only the last four digits are kept. Nothing is charged. Try 4242 4242 4242 4242, any future date, any CVC.</p>`:''}</div>`}
INP['card-num']=el=>{let v=el.value.replace(/\D/g,'').slice(0,16);el.value=v.replace(/(.{4})/g,'$1 ').trim();S.card=S.card||{};S.card.num=el.value;const [k,l]=cardBrand(v);const b=$('#'+el.dataset.p+'Brand');if(b){b.className='brand '+k;b.textContent=l}};
INP['card-exp']=el=>{let v=el.value.replace(/\D/g,'').slice(0,4);if(v.length>=3)v=v.slice(0,2)+' / '+v.slice(2);el.value=v;S.card=S.card||{};S.card.exp=v};
INP['card-cvc']=el=>{el.value=el.value.replace(/\D/g,'').slice(0,4);S.card=S.card||{};S.card.cvc=el.value};
INP['card-name']=el=>{S.card=S.card||{};S.card.name=el.value};INP['card-zip']=el=>{el.value=el.value.replace(/\D/g,'').slice(0,5);S.card=S.card||{};S.card.zip=el.value};
function readCard(p){const num=($('#'+p+'Num')?.value||'').replace(/\D/g,''),exp=($('#'+p+'Exp')?.value||'').replace(/\D/g,''),cvc=$('#'+p+'Cvc')?.value||'';const [k,l]=cardBrand(num);if(!luhn(num))return {ok:false,err:'That card number doesn\'t check out — try 4242 4242 4242 4242.'};if(exp.length<4)return {ok:false,err:'Enter the expiry as MM / YY.'};const mm=+exp.slice(0,2),yy=2000+ +exp.slice(2);if(mm<1||mm>12)return {ok:false,err:'Expiry month must be 01–12.'};if(new Date(yy,mm,0)<TODAY)return {ok:false,err:'That card has expired.'};if(cvc.length<3)return {ok:false,err:'CVC is the 3 (Amex: 4) digits on the back.'};return {ok:true,last4:num.slice(-4),brand:l,brandKey:k,exp:exp.slice(0,2)+'/'+exp.slice(2)}}
/* simulate a processor round-trip: resolves {ok:true, auth:'A1B2C3'} after ~900ms; call with a card from readCard */
function chargeCard(card,amount){return new Promise(res=>setTimeout(()=>res({ok:true,auth:('A'+Math.floor(Math.random()*1e6).toString(36)).toUpperCase().slice(0,7),last4:card.last4,brand:card.brand,amount:Math.round(amount*100)/100,at:new Date()}),900))}
/* ---- photos: real capture (camera on phones, file picker on desktop), downscaled to a data URL ---- */
function capturePhoto(cb){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');inp.style.display='none';document.body.appendChild(inp);inp.onchange=()=>{const f=inp.files&&inp.files[0];inp.remove();if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const max=520,k=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.62))};im.src=rd.result};rd.readAsDataURL(f)};inp.click()}

function qoParse(text){const idx=skuIdx();return String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const t=l.split(/[\s,;\t]+/);const sku=t[0];const p=idx[sku.toLowerCase()]||(/^\d{12}$/.test(sku)?idx[sku]:null)||null;let unit=t.slice(1).some(x=>/^(case|cs|cases)$/i.test(x))?'case':'each';if(p&&unit==='case'&&!p.casePrice)unit='each';const qn=t.slice(1).find(x=>/^\d+$/.test(x));const q=Math.max(1,Math.min(999,parseInt(qn||'1',10)));return {sku,p,q,unit}})}

  const rows=stops.map((o,i)=>{const c=CUST[o.cid];const dr=driveMin(prev,c);eta+=dr;const at=eta;eta+=9;prev=c;const cur=i===0;return `<div class="drive">${ICON.drive} ${dr} min · ${(dr/60*28).toFixed(1)} mi${i===0?' from MarCo':''}</div><div class="stop ${cur?'now':''}"><b>${i+1}. ${esc(custName(c))}</b><div class="small muted">${esc(c.addr)}, ${esc(c.city)} · ${plural(o.items.length,'line')} · ${money2(o.total)} · ${o.paid?'paid':'account'}${o.status!=='out'?' · <span class="warn">not on truck yet</span>':''}</div><div class="xs muted">ETA ${fmtT(at)} · ${c.phone}</div>${cur?`<div class="btn-row" style="margin-top:8px"><button class="btn sm p" data-act="sig" data-oid="${o.id}">Signature</button><button class="btn sm" data-act="nobody" data-oid="${o.id}">Nobody there</button></div>`:''}</div>`}).join('');
  const back=stops.length?driveMin(prev,DEPOT.supply):0;
  return `<div class="page-h"><div><h1>Today's route</h1><p>${plural(stops.length,'stop')} left · ${done.length+2} done · ${total} min of driving · about ${miles} miles${stops.length?` · back at MarCo around ${fmtT(eta+back)}`:''}</p></div><button class="btn" data-act="route-opt" ${stops.length>1?'':'disabled'}>Re-optimize</button></div><div class="card"><div class="route">${rows?rows+`<div class="drive">${ICON.drive} ${back} min · ${(back/60*28).toFixed(1)} mi back to MarCo</div>`:'<p class="muted">Route is done. Nice.</p>'}</div></div>`}

s="field"><label for="aiWt">Weight, lb (for shipping)</label><input id="aiWt" type="number" step="0.1" class="inp" value="${a.wt??''}" placeholder="9.5" data-inp="ai" data-k="wt"></div><div class="field"><label for="aiHz">Hazmat</label><select id="aiHz" class="sel" data-chg="ai" data-k="hz"><option value="none" ${a.hz==='none'?'selected':''}>Not regulated</option><option value="lq" ${a.hz==='lq'?'selected':''}>Limited quantity (ground only)</option><option value="reg" ${a.hz==='reg'?'selected':''}>Fully regulated (pails, drums)</option></select></div></div>

const SHIP_LBL={ups:'UPS Ground',truck:'Route truck',willcall:'Will-call',freight:'LTL freight'};
const miniPager=(n,per,pg,act)=>{const pages=Math.ceil(n/per);if(pages<=1)return '';return `<div class="pager">${Array.from({length:pages},(_,i)=>`<button class="${i===pg?'on':''}" data-act="${act}" data-v="${i}">${i+1}</button>`).join('')}</div>`};
function vShipments(){const f=S.shipF||'all';let list=shipments();if(f!=='all')list=list.filter(o=>shipKind(o)===f);const today=shipments().filter(o=>daysBetween(new Date(o.shippedAt),TODAY)===0);const transit=shipments().filter(o=>o.status!=='delivered');const late=transit.filter(shipLate);const P=15,pg=Math.min(S.shipPg||0,Math.max(0,Math.ceil(list.length/P)-1)),rows=list.slice(pg*P,pg*P+P);
 return `<div class="page-h"><div><h1>Shipments</h1><p>Every order that left the building. See its tracking number, where it is now, and print its label again if you need to.</p></div><div class="btn-row"><button class="btn" data-act="print-manifest">Print today's UPS manifest</button></div></div>
 <div class="grid g4 keep2" style="margin-bottom:14px"><div class="kpi"><div class="l">Shipped today</div><div class="v">${today.length}</div><div class="d">${today.filter(o=>shipKind(o)==='ups').length} UPS · ${today.filter(o=>shipKind(o)==='truck').length} route · ${today.filter(o=>shipKind(o)==='willcall').length} will-call</div></div><div class="kpi"><div class="l">On the way</div><div class="v">${transit.length}</div><div class="d">${money(transit.reduce((s,o)=>s+o.total,0))} in transit</div></div><div class="kpi"><div class="l">Delivered · 7 days</div><div class="v">${shipments().filter(o=>o.status==='delivered'&&o.deliveredAt&&daysBetween(new Date(o.deliveredAt),TODAY)<7).length}</div><div class="d">signed or scanned</div></div><div class="kpi"><div class="l">Running late</div><div class="v ${late.length?'bad':''}">${late.length}</div><div class="d">${late.length?'past the expected day — call the carrier':'nothing overdue'}</div></div></div>
 <div class="chips" style="margin-bottom:12px">${[['all','All'],['ups','UPS'],['truck','Route truck'],['willcall','Will-call'],['freight','Freight']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="ship-f" data-v="${k}">${l}</button>`).join('')}</div>
 <div class="card tight"><div class="tw"><table><thead><tr><th>Order</th><th>Customer</th><th>Method</th><th>Tracking</th><th>Status</th><th>Shipped</th><th>Expected</th><th></th></tr></thead><tbody>${rows.map(o=>{const c=CUST[o.cid];const eta=shipEta(o);return `<tr class="click" data-act="ship-open" data-oid="${o.id}"><td class="mono">#${o.id}</td><td>${esc(custName(c))}<br><span class="xs muted">${esc(c.city)}</span></td><td>${SHIP_LBL[shipKind(o)]}</td><td class="mono xs">${esc(o.tracking||'')}</td><td>${pill(shipStatus(o),o.status==='delivered'?'ok':shipLate(o)?'bad':'blue')}</td><td class="muted">${fmtD(new Date(o.shippedAt))}</td><td class="muted">${eta?fmtD(eta):'—'}</td><td class="r"><button class="btn sm ghost" data-act="print-ship" data-oid="${o.id}">Label</button></td></tr>`}).join('')||'<tr><td colspan="8" class="muted">Nothing shipped yet.</td></tr>'}</tbody></table></div>${miniPager(list.length,P,pg,'ship-pg')}</div>`}
ACT['ship-f']=d=>{S.shipF=d.v;S.shipPg=0;render()};ACT['ship-pg']=d=>{S.shipPg=+d.v;render()};
ACT['ship-open']=d=>{const o=ORDERS.find(x=>x.id==d.oid);if(!o)return;const c=CUST[o.cid];openModal(modalFrame(`Order #${o.id} · ${esc(custName(c))}`,`<div class="row" style="gap:6px;margin-bottom:10px;flex-wrap:wrap">${pill(SHIP_LBL[shipKind(o)],'blue')}${pill(shipStatus(o),o.status==='delivered'?'ok':shipLate(o)?'bad':'')}${o.refunded?pill('Refunded '+money2(o.refunded),'warn'):''}</div><div class="grid g2 keep2 small" style="margin-bottom:12px"><div><div class="muted xs">Tracking</div><span class="mono">${esc(o.tracking||'—')}</span></div><div><div class="muted xs">Ship to</div>${esc(c.addr)}<br>${esc(c.city)} ${esc(c.zip)}</div><div><div class="muted xs">Lines</div>${o.items.length} · ${money2(o.total)}</div><div><div class="muted xs">Expected</div>${shipEta(o)?fmtDT(shipEta(o)):'—'}</div></div>${o.tracking?`<div style="max-width:320px;margin:0 auto 12px">${code128(o.tracking.replace(/\s/g,''),{h:44})}</div>`:''}${shipTimelineHTML(o)}`,`<button class="btn" data-act="print-ship" data-oid="${o.id}">Label</button><button class="btn" data-act="ship-text" data-oid="${o.id}">Text tracking</button>${o.status!=='delivered'?`<button class="btn p" data-act="ship-delivered" data-oid="${o.id}">Mark delivered</button>`:'<button class="btn p" data-act="modal-close">Done</button>'}`))};

ACT['ship-delivered']=d=>{const o=ORDERS.find(x=>x.id==d.oid);if(!o)return;o.status='delivered';o.open=false;o.deliveredAt=new Date();const c=CUST[o.cid];sendMsg({cid:c.id,via:'sms',body:`MarCo: order #${o.id} was delivered. Anything short or damaged, text this number within 48 hours.`,kind:'receipt',ref:'SO-'+o.id});closeModal();toast(`#${o.id} delivered — receipt texted`);render()};

/* ---- payments (Anita) ---- */
const PAY_LBL={card:'Card',cash:'Cash',check:'Check',amazon:'Amazon',account:'Account'};
function vPayments(){syncPayments();const f=S.payF||'all';let list=PAYMENTS.filter(p=>f==='all'||(f==='refund'?p.kind==='refund':p.method===f&&p.kind!=='refund'));const P=20,pg=Math.min(S.payPg||0,Math.max(0,Math.ceil(list.length/P)-1)),rows=list.slice(pg*P,pg*P+P);const within=(p,n)=>daysBetween(new Date(p.d),TODAY)<n;const sum=fn=>PAYMENTS.filter(fn).reduce((s,p)=>s+p.amount,0);const todayS=sum(p=>within(p,1)),wk=sum(p=>within(p,7));const byM={};PAYMENTS.filter(p=>within(p,7)&&p.kind!=='refund').forEach(p=>byM[p.method]=(byM[p.method]||0)+p.amount);const fees=PAYMENTS.filter(p=>within(p,30)).reduce((s,p)=>s+p.fee,0);const refunds=-sum(p=>p.kind==='refund'&&within(p,30));
 return `<div class="page-h"><div><h1>Payments</h1><p>Every dollar in and every dollar out: card, cash, check, account, and Amazon, with the processor's fee next to it. Refund from here. The customer gets a receipt on its own.</p></div><button class="btn p" data-act="pay-take">Take a payment</button></div>
 <div class="grid g4 keep2" style="margin-bottom:14px"><div class="kpi"><div class="l">Collected today</div><div class="v">${money(todayS)}</div></div><div class="kpi"><div class="l">This week</div><div class="v">${money(wk)}</div><div class="d">${Object.entries(byM).map(([m,v])=>PAY_LBL[m]+' '+money(v)).join(' · ')||'—'}</div></div><div class="kpi"><div class="l">Card + Amazon fees · 30 days</div><div class="v">${money(fees)}</div><div class="d">2.9% + 30¢ on cards · 15% Amazon referral</div></div><div class="kpi"><div class="l">Refunds · 30 days</div><div class="v ${refunds>0?'warn':''}">${money(refunds)}</div></div></div>
 <div class="chips" style="margin-bottom:12px">${[['all','All'],['card','Card'],['cash','Cash'],['check','Check'],['amazon','Amazon'],['refund','Refunds']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="pay-f" data-v="${k}">${l}</button>`).join('')}</div>
 <div class="card tight"><div class="tw"><table><thead><tr><th>When</th><th>Customer</th><th>For</th><th>Method</th><th class="r">Amount</th><th class="r">Fee</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(p=>{const c=CUST[p.cid];return `<tr><td class="muted" style="white-space:nowrap">${fmtD(new Date(p.d))}</td><td>${c?esc(custName(c)):'—'}</td><td class="mono xs">${esc(p.ref)}${p.note?'<br><span class="muted">'+esc(p.note)+'</span>':''}</td><td>${pill(PAY_LBL[p.method]||p.method,p.method==='card'?'blue':p.method==='amazon'?'amz':'')}${p.last4?' <span class="mono xs muted">····'+p.last4+'</span>':''}</td><td class="r num ${p.amount<0?'bad':''}">${money2(p.amount)}</td><td class="r num muted">${p.fee?money2(p.fee):'—'}</td><td>${pill(p.status==='captured'?'Captured':p.status==='settling'?'Settling':p.status==='refunded'?'Refund':p.status,p.status==='captured'?'ok':p.status==='refunded'?'warn':'')}</td><td class="r"><div class="btn-row" style="justify-content:flex-end">${p.kind!=='refund'&&p.method!=='amazon'&&payRemaining(p)>0?`<button class="btn sm" data-act="pay-refund" data-id="${p.id}">Refund</button>`:''}<button class="btn sm ghost" data-act="pay-receipt" data-id="${p.id}">Receipt</button></div></td></tr>`}).join('')||'<tr><td colspan="8" class="muted">No payments yet.</td></tr>'}</tbody></table></div>${miniPager(list.length,P,pg,'pay-pg')}</div>`}
ACT['pay-f']=d=>{S.payF=d.v;S.payPg=0;render()};ACT['pay-pg']=d=>{S.payPg=+d.v;render()};
ACT['pay-receipt']=d=>{const p=PAYMENTS.find(x=>x.id==d.id);const c=CUST[p.cid];if(!c)return;sendMsg({cid:c.id,via:'email',subject:`Receipt · ${p.ref} · ${money2(Math.abs(p.amount))}`,body:`Hi ${c.name.split(' ')[0]},\n\n${p.amount<0?'We refunded':'We received'} ${money2(Math.abs(p.amount))} by ${PAY_LBL[p.method]||p.method}${p.last4?' ····'+p.last4:''} for ${p.ref} on ${fmtDY(new Date(p.d))}.\n\nThanks,\nMarCo Industry Supplies`,kind:'receipt',ref:p.ref});toast('Receipt emailed to '+c.email)};

function fillBackorders(){BACKORDERS.filter(b=>b.status==='open').forEach(b=>{const p=PROD[b.pid];if(p.stock>=b.q){p.stock-=b.q;b.status='shipped';b.shippedAt=new Date();MOVES.unshift({d:TODAY,t:fmtT(new Date().getHours()*60+new Date().getMinutes()),type:'Shipped',pid:p.id,q:-b.q,who:'Marcus',ref:b.id});sendMsg({cid:b.cid,via:'sms',body:`MarCo: the ${b.q} × ${p.name} from order #${b.oid} landed and ships today. No action needed.`,kind:'order',ref:b.id})}})}
(function(){const os=OPEN.filter(o=>o.backorder).slice(0,4);const oos=PRODUCTS.filter(p=>p.stock===0&&p.vel>1);os.forEach((o,i)=>{const it=o.items[0];const p=i===3?PROD[it.pid]:(oos[i*3]||PROD[it.pid]);BACKORDERS.push({id:'BO-'+(++boid),oid:o.id,cid:o.cid,pid:p.id,q:Math.max(1,Math.round(it.q/2)),unit:'each',d:dAdd(o.d,1),status:i===3?'shipped':'open',shippedAt:i===3?dAdd(TODAY,-1):null})})})();

c(custName(CUST[n.cid]))} · asked ${daysAgoLabel(new Date(n.d))}</span></div></div>`).join('')||'<p class="muted small">—</p>'}</div></div></div>`}
